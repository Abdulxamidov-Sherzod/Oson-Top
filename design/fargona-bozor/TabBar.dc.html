<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:9px 6px 0;height:83px;background:rgba(255,255,255,0.96);border-top:1px solid #EDF0EE;backdrop-filter:blur(14px);">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color: {{ cHome }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path></svg>
    <span style="font:500 10px -apple-system,'SF Pro Text',Helvetica,sans-serif;">Bosh sahifa</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color: {{ cPost }}">
    <div style="width:40px;height:28px;border-radius:14px;background:#16A45C;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(22,164,92,0.35);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
    <span style="font:500 10px -apple-system,'SF Pro Text',Helvetica,sans-serif;">E'lon berish</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color: {{ cProfile }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="9" r="3.4"></circle><path d="M5.5 19.5c1-3.2 3.4-4.6 6.5-4.6s5.5 1.4 6.5 4.6"></path></svg>
    <span style="font:500 10px -apple-system,'SF Pro Text',Helvetica,sans-serif;">Profil</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:83},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;post&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "home";
    const on = "#16A45C", off = "#9AA6A0";
    return {
      cHome: a === "home" ? on : off,
      cPost: a === "post" ? on : off,
      cProfile: a === "profile" ? on : off
    };
  }
}
</script>
</body>
</html>

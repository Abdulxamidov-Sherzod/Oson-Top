<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oson Top — moderatsiya</title>
<style>
:root{
  /* Ilova palitrasi — lib/core/theme/ot_colors.dart bilan bir xil */
  --accent:#16A45C; --accent-dark:#0E8C4C; --accent-soft:#EFF7F2; --accent-line:#C9E5D6;
  --ink:#14201A; --ink-2:#5C6A62; --ink-3:#8D9A93;
  --surface:#FFFFFF; --field:#F6F8F7;
  --line:#E3E8E5; --line-soft:#EDF0EE;
  --danger:#E5484D; --danger-soft:#FDECEC;
  --warn:#B7791F; --warn-soft:#FFF8E8;

  /* Yon panel — chuqur yashil, ilovaning aksentidan olingan */
  --side:#123526; --side-2:#0B2318; --side-ink:#A9C4B6;
  --ground:#EAF1EC;

  --shadow-1:0 1px 2px rgba(16,34,26,.04), 0 8px 24px rgba(16,34,26,.05);
  --shadow-2:0 2px 5px rgba(16,34,26,.07), 0 16px 38px rgba(16,34,26,.09);
}
*{box-sizing:border-box}
/* display:flex/grid `hidden` atributini bosib ketadi — bir joyda hal qilamiz */
[hidden]{display:none !important}
body{
  margin:0;color:var(--ink);min-height:100vh;
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 380px at 100% -8%, #DCEFE4 0%, transparent 62%),
    radial-gradient(760px 340px at -5% 105%, #E2EEE7 0%, transparent 60%),
    var(--ground);
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer}
a{color:var(--accent-dark)}

/* ---------- karkas ---------- */
.shell{display:flex;min-height:100vh;align-items:flex-start}

/* ---------- yon panel ---------- */
.side{
  width:238px;flex:none;align-self:stretch;
  background:linear-gradient(175deg,var(--side) 0%,var(--side-2) 100%);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 12px 0}
/* Logo ikki qatorli (Oson / Top), shuning uchun kvadratga yaqin */
.brand .logo{width:126px;height:auto;display:block}
.mark{
  width:34px;height:34px;border-radius:11px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:16px;
}
.brand-name{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand-sub{color:var(--side-ink);font-size:11.5px;font-weight:500}

.nav{display:flex;flex-direction:column;gap:3px;margin-top:26px}
.nav-label{
  color:#7C9C8B;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:0 12px 8px;
}
.tab{
  display:flex;align-items:center;gap:11px;width:100%;min-height:44px;
  border:0;background:transparent;color:var(--side-ink);
  padding:10px 12px;border-radius:12px;font-size:14.5px;font-weight:600;text-align:left;
  transition:background .15s, color .15s;
}
.tab svg{flex:none;opacity:.85}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab[aria-selected="true"]{
  background:var(--accent);color:#fff;
  box-shadow:0 6px 18px rgba(22,164,92,.34);
}
.tab[aria-selected="true"] svg{opacity:1}
.tab .n{
  margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:10px;
  background:rgba(255,255,255,.12);color:#DCEAE3;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;
}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:#fff}
.side-foot{margin-top:auto;padding:14px 12px 2px;border-top:1px solid rgba(255,255,255,.09)}
.side-who{color:#fff;font-size:13.5px;font-weight:600}
.side-role{color:var(--side-ink);font-size:11.5px}

/* ---------- yuqori qator ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
  padding:13px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.015em}
.count{
  padding:3px 10px;border-radius:999px;background:var(--accent-soft);
  border:1px solid var(--accent-line);color:var(--accent-dark);
  font-size:12.5px;font-weight:700;
}
.spacer{flex:1}
.ghost{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:11px;font-size:13.5px;font-weight:600;
}
.ghost:hover{border-color:var(--accent-line);color:var(--accent-dark)}
.wrap{padding:22px 28px 80px;max-width:1200px;width:100%}

/* ---------- kirish ---------- */
.gate{
  max-width:420px;margin:14vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:34px 30px;text-align:center;
  box-shadow:var(--shadow-2);
}
.gate-logo{width:132px;height:auto;display:block;margin:0 auto}
.gate h2{margin:16px 0 8px;font-size:20px}
.gate p{margin:0 0 22px;color:var(--ink-2);font-size:14.5px}
.primary{
  background:var(--accent);color:#fff;border:0;border-radius:13px;
  padding:13px 20px;font-size:15px;font-weight:600;width:100%;
}
.primary:hover{background:var(--accent-dark)}
.primary:disabled{opacity:.5;cursor:default}

/* ---------- e'lon kartasi ---------- */
.card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
  padding:18px;margin-bottom:14px;display:grid;
  grid-template-columns:216px minmax(0,1fr);gap:20px;
  box-shadow:var(--shadow-1);transition:box-shadow .18s, transform .18s;
}
.card:hover{box-shadow:var(--shadow-2)}
@media (max-width:760px){ .card{grid-template-columns:1fr} }
.shots{display:flex;flex-direction:column;gap:8px}
.shot-main{
  width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;
  background:var(--field);border:1px solid var(--line-soft);cursor:zoom-in;
}
.shot-row{display:flex;gap:6px;flex-wrap:wrap}
.shot-row img{
  width:46px;height:46px;object-fit:cover;border-radius:9px;
  border:1px solid var(--line-soft);cursor:zoom-in;
}
.title{font-size:17.5px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
.price{font-size:21px;font-weight:800;letter-spacing:-.025em;margin:0 0 12px;color:var(--accent-dark)}
.price.free{color:var(--ink-2);font-size:16px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{
  font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:var(--field);border:1px solid var(--line);color:var(--ink-2);
}
.tag.cat{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark)}
.desc{
  font-size:14px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;
  white-space:pre-wrap;max-height:8.5em;overflow:auto;
  background:var(--field);border:1px solid var(--line-soft);
  border-radius:12px;padding:10px 13px;
}
.desc.empty{color:var(--warn);background:var(--warn-soft);border-color:#F3E2B8}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 14px;font-size:13.5px}
dt{color:var(--ink-3)}
dd{margin:0;font-weight:500}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.approve{
  background:var(--accent);color:#fff;border:0;border-radius:12px;
  padding:11px 20px;font-weight:600;font-size:14.5px;
  box-shadow:0 4px 12px rgba(22,164,92,.28);
}
.approve:hover{background:var(--accent-dark)}
.reject{
  background:var(--surface);color:var(--danger);border:1px solid var(--danger);
  border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;
}
.reject:hover{background:var(--danger-soft)}
.revoke{
  background:var(--surface);color:var(--warn);border:1px solid #E4C88A;
  border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;
}
.revoke:hover{background:var(--warn-soft)}
.status-note{font-size:13px;color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3)}
kbd{
  font:inherit;font-size:11.5px;background:var(--field);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2);
}
.card.busy{opacity:.5;pointer-events:none}
.card.focused{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-2)}
.more{
  display:block;width:100%;margin:6px 0 0;padding:13px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);
  font-size:14.5px;font-weight:600;color:var(--ink-2);
}
.more:hover{border-color:var(--accent-line);color:var(--accent-dark);background:var(--surface)}
.more:disabled{opacity:.6;cursor:default}
.tail{text-align:center;color:var(--ink-3);font-size:13px;padding:14px 0 0}

/* ---------- foydalanuvchilar ---------- */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{
  flex:1;min-width:210px;border:1px solid var(--line);background:var(--surface);
  border-radius:13px;padding:12px 15px;font:inherit;font-size:14.5px;color:var(--ink);
  box-shadow:var(--shadow-1);
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.urow{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:15px;
  padding:14px 17px;margin-bottom:9px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;box-shadow:var(--shadow-1);transition:box-shadow .18s;
}
.urow:hover{box-shadow:var(--shadow-2)}
.urow.busy{opacity:.5;pointer-events:none}
.urow .who-cell{flex:1;min-width:190px}
.uname{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.uname .self{
  font-size:11.5px;font-weight:700;color:var(--accent-dark);
  background:var(--accent-soft);border:1px solid var(--accent-line);
  padding:1px 8px;border-radius:999px;margin-left:7px;vertical-align:1px;
}
.umeta{font-size:13px;color:var(--ink-3);margin-top:3px}
.umeta a{color:var(--ink-3)}
.role-pick{
  border:1px solid var(--line);background:var(--field);color:var(--ink);
  border-radius:11px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:600;
}
.role-pick:disabled{opacity:.55;cursor:default}
.role-pick[data-role="moderator"],.role-pick[data-role="admin"]{
  background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark);
}
.block{
  background:var(--surface);color:var(--danger);border:1px solid var(--danger);
  border-radius:11px;padding:9px 14px;font-weight:600;font-size:13.5px;
}
.block:hover{background:var(--danger-soft)}
.unblock{
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 14px;font-weight:600;font-size:13.5px;
}
.unblock:hover{border-color:var(--accent-line);color:var(--accent-dark)}
.blocked-tag{
  font-size:12px;font-weight:700;color:#8B2226;background:var(--danger-soft);
  border:1px solid var(--danger);padding:3px 10px;border-radius:999px;
}

/* ---------- xabar yuborish ---------- */
.compose{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
  padding:20px;max-width:560px;box-shadow:var(--shadow-1);
}
.compose label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.compose .field{
  width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:11px 14px;font:inherit;font-size:14.5px;color:var(--ink);
}
.compose .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.compose textarea.field{resize:vertical;min-height:84px}
.compose .row{margin-bottom:16px}
.compose .count{float:right;font-weight:500;color:var(--ink-3);background:none;border:0;padding:0}
.target{display:flex;gap:8px;flex-wrap:wrap}
.target button{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:600;
}
.target button[aria-pressed="true"]{
  background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark);
}
.compose .send{
  background:var(--accent);color:#fff;border:0;border-radius:12px;
  padding:12px 22px;font-size:14.5px;font-weight:600;
  box-shadow:0 4px 12px rgba(22,164,92,.28);
}
.compose .send:hover{background:var(--accent-dark)}
.compose .send:disabled{opacity:.5;cursor:default;box-shadow:none}
.sent{
  margin-top:14px;padding:12px 15px;border-radius:12px;font-size:14px;
  background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-dark);
}

/* ---------- holatlar ---------- */
.empty{
  text-align:center;padding:70px 20px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
  box-shadow:var(--shadow-1);
}
.empty strong{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px}
.err{
  background:var(--danger-soft);border:1px solid var(--danger);color:#8B2226;
  padding:12px 15px;border-radius:13px;margin-bottom:14px;font-size:14px;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--side);color:#fff;padding:12px 19px;border-radius:13px;
  font-size:14px;box-shadow:0 10px 30px rgba(11,35,24,.34);z-index:60;
}
.lightbox{
  position:fixed;inset:0;background:rgba(11,26,19,.88);z-index:80;
  display:grid;place-items:center;cursor:zoom-out;padding:24px;
}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px}

.brand-fallback{display:flex;align-items:center;gap:11px}
.brand-text{line-height:1.25}

/* ---------- tor ekran ---------- */
@media (max-width:900px){
  .shell{flex-direction:column}
  .side{
    width:100%;height:auto;position:static;flex-direction:row;align-items:center;
    gap:10px;padding:12px 14px;overflow-x:auto;
  }
  .brand{padding:0;flex:none}
  .brand .logo{width:64px}
  .brand-text{display:none}
  .nav{flex-direction:row;margin-top:0;gap:6px}
  .nav-label,.side-foot{display:none}
  .tab{width:auto;white-space:nowrap;padding:9px 13px}
  .topbar{padding:12px 16px}
  .wrap{padding:16px 16px 70px}
}
</style>
</head>
<body>
<div class="shell">

  <aside class="side" id="side" hidden>
    <div class="brand">
      <!-- Yon panel qorongʻi, shuning uchun oq variant. Asl rangdagisi
           logo.png da turibdi. Fayl boʻlmasa "O" belgisi koʻrsatiladi. -->
      <img class="logo" id="logo" src="logo-white.png" alt="Oson Top"
           onerror="this.hidden=true;document.getElementById('brand-fallback').hidden=false">
      <span class="brand-fallback" id="brand-fallback" hidden>
        <span class="mark">O</span>
        <span class="brand-text">
          <span class="brand-name">Oson Top</span><br>
          <span class="brand-sub">Moderatsiya</span>
        </span>
      </span>
    </div>

    <nav class="nav" id="tabs">
      <span class="nav-label">Eʼlonlar</span>
      <button class="tab" data-tab="moderation" aria-selected="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.6V8l2.3 1.4"/></svg> Kutmoqda <span class="n" id="n-moderation">0</span>
      </button>
      <button class="tab" data-tab="active" aria-selected="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.4"/><path d="M5.3 8.2l1.9 1.9 3.5-3.9"/></svg> Tasdiqlangan <span class="n" id="n-active">0</span>
      </button>
      <button class="tab" data-tab="rejected" aria-selected="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8h6.9a2.9 2.9 0 1 1 0 5.8H7.1"/><path d="M5.7 5.5 3.2 8l2.5 2.5"/></svg> Qaytarilgan <span class="n" id="n-rejected">0</span>
      </button>
      <span class="nav-label" style="margin-top:18px">Hisoblar</span>
      <button class="tab" data-tab="users" aria-selected="false" id="tab-users" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.2" cy="6" r="2.5"/><path d="M2.3 13.3c.5-2.1 2-3.3 3.9-3.3s3.4 1.2 3.9 3.3"/><path d="M11 4.2a2.3 2.3 0 0 1 0 4.4"/><path d="M12.3 13.3c-.2-1-.5-1.8-1-2.4"/></svg> Foydalanuvchilar <span class="n" id="n-users">0</span>
      </button>
      <button class="tab" data-tab="push" aria-selected="false" id="tab-push" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2a3.4 3.4 0 0 0-3.4 3.4c0 3.2-1.3 4.2-1.3 4.2h9.4s-1.3-1-1.3-4.2A3.4 3.4 0 0 0 8 2.2Z"/><path d="M6.9 12.2a1.3 1.3 0 0 0 2.2 0"/></svg> Xabar yuborish
      </button>
    </nav>

    <div class="side-foot">
      <div class="side-who" id="who"></div>
      <div class="side-role" id="who-role"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Moderatsiya</h1>
      <span class="count" id="page-count" hidden></span>
      <span class="spacer"></span>
      <button class="ghost" id="refresh" hidden>Yangilash</button>
      <button class="ghost" id="signout" hidden>Chiqish</button>
    </div>

    <div class="wrap">
      <div id="gate" class="gate" hidden>
        <!-- Bu yerda fon oq — asl rangdagi logo -->
        <img class="gate-logo" src="logo.png" alt="Oson Top">
        <h2>Moderatsiya paneli</h2>
        <p>Kirish uchun Telegram kerak. Faqat moderator huquqi bor hisoblar kira oladi.</p>
        <button class="primary" id="login">Telegram orqali kirish</button>
        <p id="gate-msg" style="margin:16px 0 0;font-size:13.5px"></p>
      </div>

      <div id="app" hidden>
        <div id="error" class="err" hidden></div>
        <div id="tools" class="tools" hidden>
          <input id="search" class="search" type="search" autocomplete="off"
                 placeholder="Nom, raqam yoki Telegram username boʻyicha qidirish">
          <span class="hint" id="staff-note"></span>
        </div>
        <div id="list"></div>
      </div>
    </div>
  </div>

</div>

<script>
const API = location.origin + '/api/v1';
let token = localStorage.getItem('ot_admin_token');
let refreshToken = localStorage.getItem('ot_admin_refresh');
// Bir vaqtda bir nechta so'rov 401 olsa, yangilash bir marta ketsin
let refreshing = null;
let items = [];
let focused = 0;
let tab = 'moderation';
let total = 0;
let loadingMore = false;
let me = null;
let userQuery = '';
const PAGE = 20;

const $ = (id) => document.getElementById(id);

function money(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function timeAgo(iso) {
  const then = new Date(iso), now = new Date();
  const min = Math.round((now - then) / 60000);
  if (min < 1) return 'hozir';
  if (min < 60) return min + ' daqiqa oldin';
  const hrs = Math.round(min / 60);
  if (hrs < 24) return hrs + ' soat oldin';
  return Math.round(hrs / 24) + ' kun oldin';
}

function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/// Kirish tokeni 30 daqiqada eskiradi. Uzoq token bilan yangilab olamiz —
/// aks holda moderator har yarim soatda qaytadan Telegram orqali kirardi.
async function renewToken() {
  if (!refreshToken) return false;
  if (refreshing) return refreshing;

  refreshing = (async () => {
    try {
      const resp = await fetch(API + '/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      if (!resp.ok) return false;
      const body = await resp.json();
      saveTokens(body.access_token, body.refresh_token);
      return true;
    } catch {
      return false;
    } finally {
      refreshing = null;
    }
  })();

  return refreshing;
}

function saveTokens(access, refresh) {
  token = access;
  refreshToken = refresh;
  localStorage.setItem('ot_admin_token', access);
  localStorage.setItem('ot_admin_refresh', refresh);
}

async function api(path, options = {}, allowRenew = true) {
  const resp = await fetch(API + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.headers || {}),
    },
  });
  if (resp.status === 401) {
    // Bir marta yangilab ko'ramiz; bo'lmasa endi haqiqatan chiqarib yuboramiz
    if (allowRenew && (await renewToken())) return api(path, options, false);
    signOut();
    throw new Error('Kirish muddati tugadi');
  }
  if (resp.status === 403) throw new Error('Sizda moderator huquqi yoʻq');
  if (!resp.ok) {
    let detail = 'Xatolik ' + resp.status;
    try { const b = await resp.json(); if (b.detail) detail = b.detail; } catch {}
    throw new Error(detail);
  }
  return resp.status === 204 ? null : resp.json();
}

// ---------- kirish ----------

function showGate(message) {
  $('gate').hidden = false;
  $('app').hidden = true;
  $('refresh').hidden = true;
  $('signout').hidden = true;
  $('side').hidden = true;
  $('page-count').hidden = true;
  $('page-title').textContent = 'Moderatsiya';
  $('who').textContent = '';
  $('who-role').textContent = '';
  if (message) $('gate-msg').textContent = message;
}

function signOut() {
  token = null;
  refreshToken = null;
  localStorage.removeItem('ot_admin_token');
  localStorage.removeItem('ot_admin_refresh');
  showGate('');
}

$('signout').onclick = signOut;

$('login').onclick = async () => {
  const button = $('login');
  button.disabled = true;
  $('gate-msg').textContent = 'Telegram ochilmoqda…';
  try {
    const start = await api('/auth/telegram/start', { method: 'POST' });
    window.open(start.deep_link, '_blank');
    $('gate-msg').textContent =
      'Telegramda «Raqamni ulashish» tugmasini bosing — shu sahifa oʻzi ochiladi.';

    const deadline = Date.now() + start.expires_in * 1000;
    const timer = setInterval(async () => {
      if (Date.now() > deadline) {
        clearInterval(timer);
        button.disabled = false;
        $('gate-msg').textContent = 'Havola eskirdi. Qaytadan urinib koʻring.';
        return;
      }
      const status = await api(
        '/auth/telegram/status?token=' + encodeURIComponent(start.token)
      ).catch(() => null);
      if (status && status.status === 'ready') {
        clearInterval(timer);
        saveTokens(status.access_token, status.refresh_token);
        button.disabled = false;
        $('gate-msg').textContent = '';
        boot();
      }
    }, 2000);
  } catch (error) {
    button.disabled = false;
    $('gate-msg').textContent = error.message;
  }
};

// ---------- navbat ----------

const EMPTY = {
  moderation: ['Navbat boʻsh', 'Hamma eʼlon koʻrib chiqilgan.'],
  active: ['Tasdiqlangan eʼlon yoʻq', 'Tasdiqlanganlar shu yerda koʻrinadi.'],
  rejected: ['Qaytarilgan eʼlon yoʻq', 'Qaytarilganlar shu yerda koʻrinadi.'],
  users: ['Hech kim topilmadi', 'Qidiruvni oʻzgartirib koʻring.'],
  push: ['', ''],
};

const TITLES = {
  moderation: 'Tekshirilmagan eʼlonlar',
  active: 'Tasdiqlangan eʼlonlar',
  rejected: 'Qaytarilgan eʼlonlar',
  users: 'Foydalanuvchilar',
  push: 'Xabar yuborish',
};

const ROLE_LABEL = {
  user: 'Foydalanuvchi',
  moderator: 'Moderator',
  admin: 'Admin',
};

function actionsFor(it) {
  if (tab === 'moderation') {
    return `
      <button class="approve" data-act="approve" data-id="${it.id}">Tasdiqlash</button>
      <button class="reject" data-act="reject" data-id="${it.id}">Qaytarish…</button>
      <span class="hint"><kbd>A</kbd> tasdiqlash · <kbd>R</kbd> qaytarish · <kbd>J</kbd>/<kbd>K</kbd> keyingi</span>`;
  }
  if (tab === 'active') {
    return `
      <button class="revoke" data-act="revoke" data-id="${it.id}">Tasdiqni bekor qilish</button>
      <span class="status-note">Lentada koʻrinib turibdi · ${it.views} koʻrish</span>`;
  }
  return `
    <button class="approve" data-act="approve" data-id="${it.id}">Qayta tasdiqlash</button>
    <span class="status-note">${
      it.reject_reason ? 'Sabab: ' + escapeHtml(it.reject_reason) : 'Sabab yozilmagan'
    }</span>`;
}

function render() {
  const list = $('list');
  $('tools').hidden = tab !== 'users';
  $('page-title').textContent = TITLES[tab];
  $('page-count').hidden = !total;
  $('page-count').textContent = total + ' ta';

  if (tab === 'push') { renderCompose(list); return; }
  if (tab === 'users') { renderUsers(list); return; }

  if (!items.length) {
    const [title, body] = EMPTY[tab];
    list.innerHTML =
      `<div class="empty"><strong>${title}</strong>${body}</div>`;
    return;
  }

  list.innerHTML = items.map((it, index) => {
    const photos = it.photos || [];
    const cover = photos[0];
    const rest = photos.slice(1);
    const price = it.price
      ? '<p class="price">' + money(it.price) + ' soʻm' +
        (it.price_unit ? ' / ' + it.price_unit : '') + '</p>'
      : '<p class="price free">Kelishiladi</p>';
    const desc = (it.description || '').trim();

    return `
      <article class="card ${tab === 'moderation' && index === focused ? 'focused' : ''}" data-id="${it.id}">
        <div class="shots">
          ${cover
            ? `<img class="shot-main" src="${cover.url}" alt="" data-full="${cover.url}">`
            : '<div class="shot-main"></div>'}
          ${rest.length
            ? `<div class="shot-row">${rest
                .map((p) => `<img src="${p.thumb_url}" alt="" data-full="${p.url}">`)
                .join('')}</div>`
            : ''}
        </div>
        <div>
          <h2 class="title">${escapeHtml(it.title)}</h2>
          ${price}
          <div class="tags">
            <span class="tag cat">${it.category_id}</span>
            <span class="tag">${it.condition}</span>
            <span class="tag">${escapeHtml(it.district)}</span>
            ${it.lat ? '<span class="tag">xaritada belgilangan</span>' : ''}
            <span class="tag">${photos.length} rasm</span>
          </div>
          <p class="desc ${desc ? '' : 'empty'}">${
            desc ? escapeHtml(desc) : 'Tavsif yozilmagan'
          }</p>
          <dl>
            <dt>Egasi</dt><dd>${escapeHtml(it.seller.name || '—')} · ${
              it.seller.phone_verified ? 'raqam tasdiqlangan' : 'raqam tasdiqlanmagan'
            } · ${it.seller.listing_count} ta eʼloni</dd>
            <dt>Joylandi</dt><dd>${timeAgo(it.created_at)}</dd>
            ${it.address ? `<dt>Manzil</dt><dd>${escapeHtml(it.address)}</dd>` : ''}
            ${it.lat
              ? `<dt>Nuqta</dt><dd><a target="_blank" rel="noopener"
                   href="https://yandex.uz/maps/?pt=${it.lng},${it.lat}&z=16&l=map"
                   >${it.lat.toFixed(5)}, ${it.lng.toFixed(5)}</a></dd>`
              : ''}
          </dl>
          <div class="actions">${actionsFor(it)}</div>
        </div>
      </article>`;
  }).join('') + tailHtml();
}

let pushTarget = 'all';
let pushUserId = '';

function renderCompose(list) {
  $('page-count').hidden = true;
  list.innerHTML = `
    <div class="compose">
      <div class="row">
        <label for="push-title">Sarlavha <span class="count" id="push-title-left">120</span></label>
        <input id="push-title" class="field" maxlength="120" placeholder="Masalan: Ilova yangilandi">
      </div>
      <div class="row">
        <label for="push-body">Matn <span class="count" id="push-body-left">240</span></label>
        <textarea id="push-body" class="field" maxlength="240"
          placeholder="Qisqa yozing — qurilma ekranida uzun matn kesiladi."></textarea>
      </div>
      <div class="row">
        <label>Kimga</label>
        <div class="target">
          <button data-target="all" aria-pressed="${pushTarget === 'all'}">Hammaga</button>
          <button data-target="one" aria-pressed="${pushTarget === 'one'}">Bitta foydalanuvchiga</button>
        </div>
      </div>
      <div class="row" id="push-user-row" ${pushTarget === 'one' ? '' : 'hidden'}>
        <label for="push-user">Foydalanuvchi id</label>
        <input id="push-user" class="field" inputmode="numeric" value="${pushUserId}"
          placeholder="Foydalanuvchilar boʻlimidagi raqam">
      </div>
      <button class="send" id="push-send">Yuborish</button>
      <div id="push-result"></div>
      <p class="hint" style="margin:14px 0 0">
        Xabar ilovadagi bildirishnomalar roʻyxatiga ham yoziladi — pushni
        oʻchirib qoʻygan yoki ilovani ochmagan odam ham keyin koʻradi.
      </p>
    </div>`;

  const title = $('push-title');
  const body = $('push-body');
  const left = (el, max, out) => { $(out).textContent = max - el.value.length; };
  title.oninput = () => left(title, 120, 'push-title-left');
  body.oninput = () => left(body, 240, 'push-body-left');

  for (const b of list.querySelectorAll('.target button')) {
    b.onclick = () => {
      pushTarget = b.dataset.target;
      // Yozilganini yo'qotmaymiz
      const keep = { t: title.value, b: body.value };
      renderCompose(list);
      $('push-title').value = keep.t;
      $('push-body').value = keep.b;
    };
  }

  const user = $('push-user');
  if (user) user.oninput = () => { pushUserId = user.value.trim(); };

  $('push-send').onclick = () => sendPush();
}

async function sendPush() {
  const title = $('push-title').value.trim();
  const body = $('push-body').value.trim();
  if (title.length < 2) { toast('Sarlavha yozing'); return; }

  const payload = { title, body };
  if (pushTarget === 'one') {
    const id = Number($('push-user').value.trim());
    if (!id) { toast('Foydalanuvchi id sini yozing'); return; }
    payload.user_id = id;
  } else if (!confirm('Xabar hamma foydalanuvchiga ketadi. Yuborilsinmi?')) {
    return;
  }

  const button = $('push-send');
  button.disabled = true;
  button.textContent = 'Yuborilmoqda…';
  try {
    const out = await api('/moderation/push', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    $('push-result').innerHTML =
      `<div class="sent">${out.users} ta foydalanuvchiga yozildi · ` +
      `${out.devices} ta qurilmaga yuborildi</div>`;
    $('push-title').value = '';
    $('push-body').value = '';
  } catch (error) {
    toast(error.message);
  }
  button.disabled = false;
  button.textContent = 'Yuborish';
}

function renderUsers(list) {
  if (!items.length) {
    const [title, body] = EMPTY.users;
    list.innerHTML = `<div class="empty"><strong>${title}</strong>${body}</div>`;
    return;
  }

  // Rol berish va bloklash faqat adminda; moderator roʻyxatni koʻradi xolos
  const canEdit = me && me.user.role === 'admin';

  list.innerHTML = items.map((u) => {
    const isSelf = me && u.id === me.user.id;
    const options = ['user', 'moderator', 'admin'].map((r) =>
      `<option value="${r}" ${r === u.role ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`
    ).join('');

    const tg = u.telegram_username
      ? ` · <a target="_blank" rel="noopener"
             href="https://t.me/${encodeURIComponent(u.telegram_username)}"
             >@${escapeHtml(u.telegram_username)}</a>`
      : '';

    return `
      <div class="urow" data-id="${u.id}">
        <div class="who-cell">
          <div class="uname">${escapeHtml(u.name || 'Nomsiz')}${
            isSelf ? '<span class="self">siz</span>' : ''
          }</div>
          <div class="umeta">
            ${escapeHtml(u.phone || 'raqam yoʻq')}${tg}
            · ${u.listing_count} ta eʼlon
            · ${timeAgo(u.created_at)} qoʻshilgan
          </div>
        </div>
        ${u.is_blocked ? '<span class="blocked-tag">Bloklangan</span>' : ''}
        <select class="role-pick" data-role="${u.role}" data-id="${u.id}"
                ${canEdit && !isSelf ? '' : 'disabled'}>${options}</select>
        ${canEdit && !isSelf
          ? (u.is_blocked
              ? `<button class="unblock" data-act="unblock" data-id="${u.id}">Blokni yechish</button>`
              : `<button class="block" data-act="block" data-id="${u.id}">Bloklash</button>`)
          : ''}
      </div>`;
  }).join('') + tailHtml();
}

function tailHtml() {
  if (items.length >= total) {
    return items.length > 6
      ? `<p class="tail">Hammasi shu — ${total} ta</p>`
      : '';
  }
  return `<button class="more" id="more" ${loadingMore ? 'disabled' : ''}>${
    loadingMore
      ? 'Yuklanmoqda…'
      : `Yana yuklash (${items.length} / ${total})`
  }</button>`;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

async function loadCounts() {
  try {
    const counts = await api('/moderation/counts');
    for (const key of ['moderation', 'active', 'rejected']) {
      $('n-' + key).textContent = counts[key];
    }
  } catch { /* sonlar muhim emas — ro'yxat baribir yuklanadi */ }

  try {
    const people = await api('/moderation/users/counts');
    $('n-users').textContent = people.total;
    $('staff-note').textContent =
      `${people.staff} ta xodim · ${people.blocked} ta bloklangan`;
  } catch { /* shu yerda ham sonlar ikkinchi darajali */ }
}

async function fetchPage(offset) {
  // Ro'yxat to'liq ma'lumot bilan keladi — har bir e'lon uchun alohida
  // so'rov yubormaymiz
  return api(
    `/moderation/listings?status=${tab}&limit=${PAGE}&offset=${offset}`
  );
}

function fetchUsers(offset) {
  const params = new URLSearchParams({ limit: PAGE, offset });
  if (userQuery) params.set('q', userQuery);
  return api('/moderation/users?' + params);
}

async function load() {
  try {
    $('error').hidden = true;
    if (tab === 'push') {
      items = [];
      total = 0;
      render();
      return;
    }
    $('list').innerHTML = '<div class="empty">Yuklanmoqda…</div>';
    const page = tab === 'users' ? await fetchUsers(0) : await fetchPage(0);
    items = page.items;
    total = page.total;
    focused = 0;
    render();
    loadCounts();
  } catch (error) {
    $('error').hidden = false;
    $('error').textContent = error.message;
    $('list').innerHTML = '';
  }
}

async function loadMore() {
  if (loadingMore || items.length >= total) return;
  loadingMore = true;
  render();
  try {
    const page = tab === 'users'
      ? await fetchUsers(items.length)
      : await fetchPage(items.length);
    items = items.concat(page.items);
    total = page.total;
  } catch (error) {
    toast(error.message);
  }
  loadingMore = false;
  render();
}

$('tabs').addEventListener('click', (event) => {
  const button = event.target.closest('.tab');
  if (!button || button.dataset.tab === tab) return;
  tab = button.dataset.tab;
  for (const el of document.querySelectorAll('.tab')) {
    el.setAttribute('aria-selected', String(el.dataset.tab === tab));
  }
  load();
});

let searchTimer = null;
$('search').addEventListener('input', (event) => {
  const value = event.target.value;
  clearTimeout(searchTimer);
  // Har harfda so'rov yubormaymiz
  searchTimer = setTimeout(() => {
    userQuery = value.trim();
    load();
  }, 350);
});

async function setRole(id, role) {
  const row = document.querySelector(`.urow[data-id="${id}"]`);
  if (row) row.classList.add('busy');
  try {
    const updated = await api(`/moderation/users/${id}/role`, {
      method: 'PATCH',
      body: JSON.stringify({ role }),
    });
    items = items.map((u) => (u.id === id ? updated : u));
    render();
    loadCounts();
    toast(`${updated.name || updated.phone} — ${ROLE_LABEL[role]}`);
  } catch (error) {
    if (row) row.classList.remove('busy');
    toast(error.message);
    render();
  }
}

async function setBlocked(id, blocked) {
  const row = document.querySelector(`.urow[data-id="${id}"]`);
  if (row) row.classList.add('busy');
  try {
    const updated = await api(`/moderation/users/${id}/block`, {
      method: 'PATCH',
      body: JSON.stringify({ blocked }),
    });
    items = items.map((u) => (u.id === id ? updated : u));
    render();
    loadCounts();
    toast(blocked ? 'Bloklandi' : 'Blok yechildi');
  } catch (error) {
    if (row) row.classList.remove('busy');
    toast(error.message);
  }
}

document.addEventListener('change', (event) => {
  const pick = event.target.closest('.role-pick');
  if (!pick) return;
  setRole(Number(pick.dataset.id), pick.value);
});

async function decide(id, action, reason) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.add('busy');
  try {
    await api(`/moderation/listings/${id}/${action}`, {
      method: 'POST',
      body: action === 'reject' ? JSON.stringify({ reason }) : undefined,
    });
    // E'lon boshqa bo'limga o'tdi — shu ro'yxatdan olib tashlaymiz
    items = items.filter((i) => i.id !== id);
    total = Math.max(0, total - 1);
    if (focused >= items.length) focused = Math.max(0, items.length - 1);
    render();
    loadCounts();
    toast({
      approve: 'Tasdiqlandi',
      reject: 'Qaytarildi',
      revoke: 'Tasdiq bekor qilindi — navbatga qaytdi',
    }[action]);
  } catch (error) {
    if (card) card.classList.remove('busy');
    toast(error.message);
  }
}

function rejectFlow(id) {
  const reason = prompt(
    'Nima uchun qaytarilyapti?\nSabab eʼlon egasiga koʻrinadi.',
    'Rasm sifati past, qaytadan suratga oling'
  );
  if (reason && reason.trim().length >= 3) decide(id, 'reject', reason.trim());
}

document.addEventListener('click', (event) => {
  const full = event.target.dataset?.full;
  if (full) {
    const box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = `<img src="${full}" alt="">`;
    box.onclick = () => box.remove();
    document.body.appendChild(box);
    return;
  }
  if (event.target.id === 'more') { loadMore(); return; }
  const act = event.target.dataset?.act;
  if (!act) return;
  const id = Number(event.target.dataset.id);
  if (act === 'block' || act === 'unblock') {
    const row = items.find((u) => u.id === id);
    const who = row ? (row.name || row.phone) : 'Hisob';
    if (act === 'block' &&
        !confirm(`${who} bloklansinmi?\nU ilovaga kira olmay qoladi.`)) return;
    setBlocked(id, act === 'block');
    return;
  }
  if (act === 'reject') rejectFlow(id);
  else decide(id, act);
});

// Klaviatura — navbat uzun boʻlganda tez ishlash uchun
document.addEventListener('keydown', (event) => {
  if ($('app').hidden || !items.length || tab !== 'moderation') return;
  if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
  const key = event.key.toLowerCase();
  if (key === 'j') { focused = Math.min(focused + 1, items.length - 1); render(); }
  else if (key === 'k') { focused = Math.max(focused - 1, 0); render(); }
  else if (key === 'a') decide(items[focused].id, 'approve');
  else if (key === 'r') rejectFlow(items[focused].id);
});

$('refresh').onclick = load;

async function boot() {
  if (!token) return showGate('');
  try {
    me = await api('/me');
    $('who').textContent = me.user.name || me.user.phone;
    $('who-role').textContent = ROLE_LABEL[me.user.role];
    // Moderator ro'yxatni ko'radi, o'zgartirishni faqat admin qiladi
    $('tab-users').hidden = !['moderator', 'admin'].includes(me.user.role);
    // Xabar yuborish — faqat admin
    $('tab-push').hidden = me.user.role !== 'admin';
    $('gate').hidden = true;
    $('app').hidden = false;
    $('refresh').hidden = false;
    $('signout').hidden = false;
    $('side').hidden = false;
    await load();
  } catch (error) {
    showGate(error.message);
  }
}

boot();
</script>
